name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Secret
        run: |
          if [ -z "${{ secrets.PORTFOLIO_SHEET_ID }}" ]; then
            echo "::warning::PORTFOLIO_SHEET_ID is missing or empty!"
          else
            echo "Secret is found."
          fi

      - name: Create Config File
        run: |
          printf "window.PORTFOLIO_CONFIG = { sheetId: '%s' };\n" "${{ secrets.PORTFOLIO_SHEET_ID }}" > config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
